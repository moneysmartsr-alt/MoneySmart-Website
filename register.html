
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account aanmaken | MoneySmart</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #071426;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .register-box {
      width: 100%;
      max-width: 430px;
      background: #10223a;
      padding: 35px;
      border-radius: 16px;
      border: 1px solid #203750;
    }

    .logo {
      color: #20d68a;
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #a9b8ca;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 19px;
      border: 1px solid #30465e;
      border-radius: 8px;
      background: #071426;
      color: white;
      font-size: 15px;
    }

    input:focus {
      outline: 1px solid #20d68a;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #20d68a;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
      color: #a9b8ca;
    }

    .login-link {
      text-align: center;
      margin-top: 25px;
      font-size: 14px;
      color: #a9b8ca;
    }

    a {
      color: #20d68a;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="register-box">

    <div class="logo">MoneySmart</div>

    <h1>Maak jouw account aan</h1>

    <p class="subtitle">
      Start vandaag met het verbeteren van jouw financiële kennis.
    </p>

    <form id="registerForm">

      <label for="email">E-mailadres</label>
      <input
        type="email"
        id="email"
        placeholder="Jouw e-mailadres"
        autocomplete="email"
        required
      >

      <label for="password">Wachtwoord</label>
      <input
        type="password"
        id="password"
        placeholder="Minimaal 8 tekens"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <label for="confirmPassword">Bevestig wachtwoord</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Herhaal jouw wachtwoord"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <button type="submit" id="registerButton">
        Account aanmaken
      </button>

    </form>

    <div id="message" aria-live="polite"></div>

    <div class="login-link">
      Heb je al een account?
      <a href="login.html">Log hier in</a>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://nohyhpxugfdwmywcukgu.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_iVyC2aAwhw3h4kYUg8x74Q_vCFT28Z2";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const button = document.getElementById("registerButton");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      message.textContent = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        message.textContent =
          "Je wachtwoord moet minimaal 8 tekens bevatten.";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent =
          "De twee wachtwoorden komen niet overeen.";
        return;
      }

      button.disabled = true;
      button.textContent = "Account wordt aangemaakt...";

      try {
        const { data, error } = await supabaseClient.auth.signUp({
          email: email,
          password: password,
          options: {
            emailRedirectTo:
              "https://moneysmartsr-alt.github.io/MoneySmart-Website/"
          }
        });

        if (error) {
          message.textContent = error.message;
          return;
        }

        if (data.session) {
          message.textContent =
            "Je account is aangemaakt! Je kunt nu inloggen.";
          form.reset();
        } else {
          message.textContent =
            "Je account is aangemaakt! Controleer je e-mail en klik op de bevestigingslink. Daarna kun je inloggen.";
          form.reset();
        }

      } catch (error) {
        message.textContent =
          "Er is iets misgegaan. Probeer het opnieuw.";
      } finally {
        button.disabled = false;
        button.textContent = "Account aanmaken";
      }
    });
  </script>

</body>
</html>
