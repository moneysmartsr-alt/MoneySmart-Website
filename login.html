
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inloggen | MoneySmart</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #071426;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #10223a;
      padding: 35px;
      border-radius: 16px;
      border: 1px solid #203750;
    }

    .logo {
      color: #20d68a;
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #a9b8ca;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 20px;
      border: 1px solid #30465e;
      border-radius: 8px;
      background: #071426;
      color: white;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #20d68a;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      color: #ff9999;
      line-height: 1.5;
    }

    .back {
      text-align: center;
      margin-top: 25px;
      font-size: 14px;
    }

    a {
      color: #20d68a;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">MoneySmart</div>

    <h1>Welkom terug!</h1>

    <p class="subtitle">
      Log in op jouw MoneySmart-account.
    </p>

    <form id="loginForm">

      <label for="email">E-mailadres</label>
      <input
        type="email"
        id="email"
        placeholder="Jouw e-mailadres"
        required
      >

      <label for="password">Wachtwoord</label>
      <input
        type="password"
        id="password"
        placeholder="Jouw wachtwoord"
        required
      >

      <button type="submit" id="loginButton">
        Inloggen
      </button>

    </form>

    <div id="message"></div>

    <div class="back">
      <a href="index.html">← Terug naar MoneySmart</a>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://nohyhpxugfdwmywcukgu.supabase.co";

    const SUPABASE_KEY = "sb_publishable_iVyC2aAwhw3h4kYUg8x74Q_vCFT28Z2";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      message.textContent = "";
      loginButton.disabled = true;
      loginButton.textContent = "Even wachten...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        message.textContent =
          "Inloggen mislukt: controleer je e-mailadres en wachtwoord.";
        loginButton.disabled = false;
        loginButton.textContent = "Inloggen";
        return;
      }

      window.location.href = "dashboard.html";
    });
  </script>

</body>
</html>
